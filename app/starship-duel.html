const INSULTS = ['Эй, консервная банка!','Твой капитан — тостер!','Тормоз!','Ржавое ведро!','Слабак!','Лети домой к маме!',
  'Ты стреляешь, как Заяц!','Ха! Мимо!','Космический мусор!','Бе-бе-бе!','Кто тебя собирал?','Скучно с тобой!'];
const AIP = {
  easy:  {think:.25, aim:.30, fire:.6,  spec:.4},
  normal:{think:.12, aim:.18, fire:.85, spec:.7},
  hard:  {think:.05, aim:.10, fire:1,   spec:1},

// ================= НАСТРОЙКИ =================
const OPTS = [
  {k:'mode', label:'Режим', opts:[['ai','Против робота'],['pvp','Двое на одном устройстве']]},
  {k:'diff', label:'Сложность робота', opts:[['easy','Легко'],['normal','Средне'],['hard','Сложно']]},
  {k:'fleet', label:'Кораблей во флоте', opts:[['3','3'],['5','5'],['8','Все 8']]},
  {k:'planet', label:'Планета с гравитацией', opts:[['on','Да'],['off','Нет']]},
  {k:'asteroids', label:'Астероиды', opts:[['on','Да'],['off','Нет']]},
  {k:'sound', label:'Звук', opts:[['on','Вкл'],['off','Выкл']]},
];
const DEFAULT_CFG = {mode:'ai', diff:'normal', fleet:'5', planet:'on', asteroids:'on', sound:'on'};
const KEY = 'melee_cfg_v1';
const store = (() => { try { const s = window.localStorage; s.setItem('__t','1'); s.removeItem('__t'); return s; } catch (_) { return null; } })();
function loadCfg(){
  const c = Object.assign({}, DEFAULT_CFG);
  let src = null;
  try { if (store) src = JSON.parse(store.getItem(KEY) || 'null'); } catch (_) {}
  if (src && typeof src === 'object') for (const o of OPTS) if (o.opts.some(x => x[0] === src[o.k])) c[o.k] = src[o.k];
  return c;
}
function saveCfg(){ try { if (store) store.setItem(KEY, JSON.stringify(cfg)); } catch (_) {} }
let cfg = loadCfg();

// ================= СОСТОЯНИЕ =================
const canvas = $('game'), ctx = canvas.getContext('2d');
let sides = [], shots = [], fighters = [], pods = [], asteroids = [], particles = [], beams = [], bubbles = [], msgs = [];
let state = 'menu', menuOpen = true, time = 0, shake = 0, interT = 0, pickQueue = [];
let cam = {x:PX - 500, y:PY, zoom:0.75, zt:0.75};
let touchMode = false;
const kb = [{}, {}], tin = [{}, {}];
const STARS = [0.12, 0.3, 0.55].map((f, i) => ({f, size:i === 2 ? 2 : 1, col:['#556','#99a','#dde'][i],
  s:Array.from({length:[140, 80, 40][i]}, () => [Math.random() * 1500, Math.random() * 1500])}));

// ================= ЗВУК =================
let AC = null, master = null, noiseBuf = null;
function audio(){
  if (cfg.sound !== 'on') return null;
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination); }
    catch (_) { AC = null; return null; }
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function noise(){
  if (!noiseBuf) {
    const len = AC.sampleRate * 2; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function env(g, t0, a, peak, dur){ g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); }
function nz(t0, dur, peak, f0, f1, type){
  const s = AC.createBufferSource(); s.buffer = noise();
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass';
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = AC.createGain(); env(g, t0, 0.005, peak, dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
}
function tone(t0, dur, peak, f0, f1, type){
  const o = AC.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = AC.createGain(); env(g, t0, 0.01, peak, dur); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function voiceSynth(t0, dur, peak, f0, f1, formants){
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); env(g, t0, 0.04, peak, dur); g.connect(master);
  for (const [fq, q, amp] of formants) {
    const b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fq; b.Q.value = q;
    const a = AC.createGain(); a.gain.value = amp; o.connect(b); b.connect(a); a.connect(g);
  }
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const SYNTH = {
  gun(){ const t = AC.currentTime; tone(t, 0.07, 0.18, 1400, 500, 'square'); },
  shot(){ const t = AC.currentTime; nz(t, 0.3, 0.4, 2500, 300); tone(t, 0.25, 0.3, 300, 80, 'sawtooth'); },
  boom(){ const t = AC.currentTime; nz(t, 0.6, 0.7, 1500, 60); tone(t, 0.5, 0.6, 90, 30); },
  nuke(){ const t = AC.currentTime; nz(t, 1.8, 1, 2500, 40); tone(t, 1.5, 1, 70, 20); },
  hurt(){ const t = AC.currentTime, f = 150 + Math.random() * 60; voiceSynth(t, 0.28, 0.45, f, f * 0.7, [[500, 6, 1], [850, 8, 0.6]]); },
  death(){ const t = AC.currentTime, f = 200 + Math.random() * 40; voiceSynth(t, 1.0, 0.45, f, f * 0.45, [[700, 5, 1], [1100, 7, 0.5]]); },
  shield(){ const t = AC.currentTime; tone(t, 0.4, 0.2, 300, 900, 'triangle'); },
  dirt(){ const t = AC.currentTime; tone(t, 0.12, 0.3, 200, 80, 'square'); },
  win(){ const t = AC.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(t + i * 0.12, 0.3, 0.25, f, f, 'square')); },
  laser(){ const t = AC.currentTime; tone(t, 0.09, 0.2, 2200, 700, 'square'); },
  warp(){ const t = AC.currentTime; tone(t, 0.45, 0.25, 180, 1600, 'sine'); tone(t + 0.05, 0.4, 0.15, 90, 800, 'triangle'); },
  beep(){ const t = AC.currentTime; tone(t, 0.1, 0.25, 880, 880, 'square'); tone(t + 0.15, 0.1, 0.25, 880, 880, 'square'); },
};
const ALIAS = {laser:'deflect'};
const SND_NAMES = ['gun','shot','boom','nuke','hurt','death','shield','dirt','win','deflect'];
const samples = {};
function addSample(n, a){ (samples[n] = samples[n] || []).push(a); }
function probe(src, ok, fail){
  const a = new Audio(); a.preload = 'auto';
  a.addEventListener('canplaythrough', () => ok(a), {once:true});
  a.addEventListener('error', fail, {once:true});
  a.src = src;
}
function loadSamples(){
  const EMB = window.EMBED_SOUNDS;
  if (EMB) { for (const n in EMB) for (const src of EMB[n]) { const a = new Audio(src); a.preload = 'auto'; addSample(n, a); } return; }
  for (const n of SND_NAMES) {
    const exts = ['ogg', 'mp3', 'wav'];
    const single = i => { if (i < exts.length) probe(`sounds/${n}.${exts[i]}`, a => addSample(n, a), () => single(i + 1)); };
    const bank = k => { if (k <= 24) probe(`sounds/${n}${k}.ogg`, a => { addSample(n, a); bank(k + 1); }, () => { if (k === 1) single(0); }); };
    try { bank(1); } catch (_) {}
  }
}
const lastPlay = {};
function sfx(name){
  if (cfg.sound !== 'on') return;
  const now = performance.now();
  if (lastPlay[name] && now - lastPlay[name] < 60) return;
  lastPlay[name] = now;
  const bank = samples[ALIAS[name] || name];
  if (bank && bank.length) {
    const s = bank[Math.floor(Math.random() * bank.length)];
    try { const a = s.cloneNode(); a.volume = 0.7; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
    return;
  }
  if (!audio() || !SYNTH[name]) return;
  try { SYNTH[name](); } catch (_) {}
}
function playDitty(def){
  if (!audio()) return;
  const t = AC.currentTime + 0.05;
  def.ditty.forEach((m, i) => { const f = 440 * Math.pow(2, (m - 69) / 12); tone(t + i * 0.15, 0.22, 0.18, f, f, def.wave); });
}

function randomSpot(avoid, minD){
  for (let t = 0; t < 60; t++) {
    const x = rnd(0, WW), y = rnd(0, WW);
    if (cfg.planet === 'on' && Math.hypot(wd(x, PX), wd(y, PY)) < PR + 350) continue;
    if (avoid && Math.hypot(wd(x, avoid.x), wd(y, avoid.y)) < minD) continue;
    return {x, y};
  }

function update(dt){
  if (menuOpen || (state !== 'fight' && state !== 'inter')) return;
  time += dt;
  for (const sd of sides) {
    const s = sd.ship; if (!s || !s.alive) continue;
    if (sd.ai) aiThink(s, otherShip(sd.i), dt);
    updateShip(s, getCtl(sd, s), dt);
  }
  collideShips();
  updateWorld(dt);
  updateCam(dt);
  if (shake > 0) shake *= Math.pow(0.02, dt);

}
function pickFleet(n){
  const idx = SHIPS.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = irnd(0, i); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, n).sort((a, b) => a - b);
}
function startMatch(){
  const n = +cfg.fleet;
  sides = [0, 1].map(i => ({i, ai:i === 1 && cfg.mode === 'ai',
    label:cfg.mode === 'ai' ? (i ? 'Робот' : 'Вы') : (i ? 'Красные' : 'Синие'),
    color:i ? '#ff5a4a' : '#3fa9ff', fleet:pickFleet(n), used:[], ship:null, kills:0}));
  shots = []; fighters = []; pods = []; particles = []; beams = []; bubbles = []; msgs = [];
  asteroids = [];
  if (cfg.asteroids === 'on') for (let k = 0; k < 6; k++) asteroids.push(newAsteroid());
  for (const o of kb) for (const k in o) o[k] = false;
  for (const o of tin) for (const k in o) o[k] = false;

  menuOpen = false;

}
function nextPick(){
  while (pickQueue.length) {
    const sd = sides[pickQueue[0]];
    const avail = sd.fleet.filter(t => !sd.used.includes(t));
    if (!avail.length) { pickQueue.shift(); continue; }
    if (sd.ai) { pickQueue.shift(); deploy(sd, avail[irnd(0, avail.length - 1)]); continue; }
    showPicker(sd, avail);

}

  sd.used.push(ti);
  const s = makeShip(sd, ti);
  placeShip(s, otherShip(sd.i));
  sd.ship = s;
  ringFX(s.x, s.y, sd.color); sfx('warp');
  pushMsg(`${sd.label}: ${s.def.name}, кап. ${s.captain}`, sd.color);

  const survivor = sides.find(sd => sd.ship && sd.ship.alive);

  const lost = sides.filter(sd => !(sd.ship && sd.ship.alive));
  const out = lost.filter(sd => sd.fleet.every(t => sd.used.includes(t)));
  if (out.length) { endMatch(out.length === 2 ? null : sides[1 - out[0].i]); return; }

}

  });
  return pad;
}
function makeFires(pi){
  const f = document.createElement('div'); f.className = 'tfire';
  f.append(tbtn('✦', pi, 'spec', 'mid'), tbtn('⚡', pi, 'gun', 'big'));
  return f;
}
function buildTouch(){
  const box = $('touch'); box.innerHTML = '';
  $('rotate').classList.toggle('need', touchMode);
  if (!touchMode || state === 'over' || state === 'pick') return;
  const humans = sides.filter(sd => !sd.ai);
  if (humans.length === 1) {
    const L = document.createElement('div'); L.className = 'tgroup left'; L.appendChild(makePad(humans[0].i));
    const R = document.createElement('div'); R.className = 'tgroup right'; R.appendChild(makeFires(humans[0].i));
    box.append(L, R);
  } else {
    humans.forEach((sd, idx) => {
      const g = document.createElement('div'); g.className = 'tgroup ' + (idx === 0 ? 'left' : 'right');
      if (idx === 0) g.append(makePad(sd.i), makeFires(sd.i)); else g.append(makeFires(sd.i), makePad(sd.i));
      box.appendChild(g);
    });
  }
}
touchMode = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
window.addEventListener('touchstart', () => { if (!touchMode) { touchMode = true; if (state === 'fight' || state === 'inter') buildTouch(); } }, {passive:true});

// ================= МЕНЮ =================
function helpText(){
  const base = 'Каждый корабль: поворот, тяга, огонь, спец. Экипаж — жизнь, батарея — энергия для оружия. Край поля сквозной, у планеты гравитация (удар о неё стоит экипажа).<br>';
  return base + (cfg.mode === 'ai'
    ? 'Клавиатура: A D или ← → — поворот, W или ↑ — тяга, F / пробел / Enter — огонь, G / S / ↓ — спец. Esc — меню.'
    : 'Синие: A D — поворот, W — тяга, F — огонь, G или S — спец.<br>Красные: ← → — поворот, ↑ — тяга, «.» / Enter / правый Ctrl — огонь, ↓ / «/» / правый Shift — спец. Esc — меню.');
}
function buildMenu(){
  const box = $('opts'); box.textContent = '';
  for (const o of OPTS) {
    const row = document.createElement('div'); row.className = 'frow';
    const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = o.label;
    const seg = document.createElement('div'); seg.className = 'seg';
    const btns = [];
    const mark = () => btns.forEach(b => b.classList.toggle('on', b.dataset.v === cfg[o.k]));
    for (const [v, l] of o.opts) {
      const b = document.createElement('button'); b.textContent = l; b.dataset.v = v;
      b.addEventListener('click', () => { cfg[o.k] = v; saveCfg(); mark(); if (o.k === 'mode') $('help').innerHTML = helpText(); if (o.k === 'sound' && v === 'on') { audio(); sfx('gun'); } });
      btns.push(b); seg.appendChild(b);
    }
    mark();
    row.append(lbl, seg); box.appendChild(row);
  }
  $('help').innerHTML = helpText();
}
function openMenu(){
  if (menuOpen) return;
  menuOpen = true;
  $('resumeBtn').style.display = state !== 'menu' && state !== 'over' ? 'block' : 'none';
  $('menu').classList.add('show');
}
function resume(){ menuOpen = false; $('menu').classList.remove('show'); for (const o of tin) for (const k in o) o[k] = false; }
$('startBtn').addEventListener('click', e => { e.currentTarget.blur(); audio(); $('pick').classList.remove('show'); startMatch(); });
$('resumeBtn').addEventListener('click', e => { e.currentTarget.blur(); resume(); });
$('againBtn').addEventListener('click', e => { e.currentTarget.blur(); startMatch(); });
$('toMenuBtn').addEventListener('click', e => { e.currentTarget.blur(); $('over').classList.remove('show'); state = 'menu'; menuOpen = true; $('resumeBtn').style.display = 'none'; $('menu').classList.add('show'); $('menuBtn').style.display = 'none'; });
$('menuBtn').addEventListener('click', e => { e.currentTarget.blur(); if (state !== 'menu' && state !== 'over') openMenu(); });

// ================= ЗАПУСК =================
let last = performance.now(), acc = 0, loopErr = false;
function frame(now){
  try {
    const el = Math.min(0.1, (now - last) / 1000); last = now;
    acc += el;
    let n = 0;
    while (acc >= DT && n < 30) { update(DT); acc -= DT; n++; }
    if (n >= 30) acc = 0;
    if (state === 'menu') { cam.x += 20 * el; cam.y += 8 * el; }
    render();
  } catch (e) { if (!loopErr) { loopErr = true; showErr(e); } }
  requestAnimationFrame(frame);
}
try { buildMenu(); } catch (e) { showErr(e); }
try { loadSamples(); } catch (e) { showErr(e); }
fit();
requestAnimationFrame(frame);
})();
</script>

<!-- ===== Полноэкранный режим ===== -->
<style>
#fsBtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;color:#fff;font-family:inherit}
#fsBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#fsBtn.float{position:fixed;z-index:11;bottom:max(8px,env(safe-area-inset-bottom));left:calc(50% + 34px);width:40px;height:32px;padding:0;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:8px}
</style>
<script>
(function () {
  var d = document.documentElement;
  var req = d.requestFullscreen || d.webkitRequestFullscreen;
  var exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!req) return;
  var cur = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
  var ICON_ON  = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var b = document.createElement('button');
  b.id = 'fsBtn'; b.type = 'button'; b.className = 'float';
  document.body.appendChild(b);
  function upd() {
    var on = !!cur();
    b.innerHTML = on ? ICON_OFF : ICON_ON;
    b.title = on ? 'Выйти из полноэкранного режима' : 'Во весь экран';
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 150);
  }
  b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  b.addEventListener('click', function (e) {
    e.preventDefault(); b.blur();
    if (cur()) { var p = exit.call(document); if (p && p.catch) p.catch(function () {}); }
    else {
      var q = req.call(d); if (q && q.catch) q.catch(function () {});
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (_) {}
    }
  });
  document.addEventListener('fullscreenchange', upd);
  document.addEventListener('webkitfullscreenchange', upd);
  upd();
})();
</script>
